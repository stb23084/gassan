<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>自動切り替え360°背景 - A-Frame</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
</style>
</head>
<body>
<a-scene>
  <!-- 背景 -->
  <a-sky id="sky" src="IMG_20230807_115343_00_merged.jpg"></a-sky>

  <!-- テキスト（説明やタイトル） -->
  <a-entity 
    id="message"
    text="value: 最初の景色です; color: white; width: 4"
    position="0 1.6 -2">
  </a-entity>

  <!-- ナレーション（最初の音声） -->
  <a-entity id="narration" sound="src: url(narration1.mp3); autoplay: true; volume: 1.2"></a-entity>

  <!-- カメラ -->
  <a-entity camera look-controls></a-entity>
</a-scene>

<script>
  // 画像を順番に切り替え
  const images = [
    "IMG_20230807_115343_00_merged.jpg",
    "IMG_20230807_122331_00_merged.jpg",
    "IMG_20230807_124540_00_merged.jpg",
    "gassan.jpeg"
  ];

  const texts = [
    "最初の景色です",
    "2番目の場所に来ました",
    "3番目のポイントです",
    "最後の画像です"
  ];

  const narrations = [
    "narration1.mp3",
    "narration2.mp3",
    "narration3.mp3",
    "narration4.mp3"
  ];

  let index = 0;

  setInterval(() => {
    index = (index + 1) % images.length;

    // 画像切り替え
    document.querySelector("#sky").setAttribute("src", images[index]);

    // テキスト切り替え
    document.querySelector("#message")
      .setAttribute("text", "value: " + texts[index]);

    // ナレーション切り替え
    const narr = document.querySelector("#narration");
    narr.setAttribute("sound", "src: url(" + narrations[index] + ")");
    narr.components.sound.stopSound();
    narr.components.sound.playSound();

  }, 10000);
</script>
</body>
</html>
