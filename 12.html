<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>自動切り替え360°背景 - A-Frame</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
</style>
</head>
<body>
<a-scene>
  <!-- 背景 -->
  <a-sky id="sky" src="IMG_20230807_115343_00_merged.jpg"></a-sky>

  <!-- カメラ -->
  <a-entity camera look-controls></a-entity>
</a-scene>

<script>
  // 360°画像を順番に切り替える
  const images = ["IMG_20230807_115343_00_merged.jpg", "IMG_20230807_122331_00_merged.jpg", "IMG_20230807_124540_00_merged.jpg","gassan.jpeg"];
  let index = 0;

  setInterval(() => {
    index = (index + 1) % images.length;
    document.querySelector("#sky").setAttribute("src", images[index]);
  }, 10000); // 5秒ごとに切り替え
</script>
</body>
</html>
